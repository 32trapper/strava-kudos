services:
  strava-auto-kudos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strava-auto-kudos
    init: true
    restart: "no"
    stop_grace_period: 30s
    shm_size: 1gb
    env_file:
      - .env
    environment:
      STRAVA_HEADLESS: "true"
      STRAVA_FIREFOX_PROFILE: /data/firefox-profile
    volumes:
      # Persistent authenticated Firefox profile
      - ../firefox-profile:/data/firefox-profile:Z
      # Persistent application state
      - ../strava_processed.json:/data/strava_processed.json:Z
      - ../state.json:/data/state.json:Z
    working_dir: /data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
